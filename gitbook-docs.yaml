$schema: https://api.gitbook.com/gitbook-docs.yaml
# GitBook's Git Sync: the documentation is one space, whose pages are in
# docs, with docs/README.md as its first page, and docs/SUMMARY.md as its
# table of contents
site:
  title: go-llm
  structure:
    - type: section
      key: documentation
      title: Documentation
      path: documentation
      children:
        - type: space
          key: docs
          title: go-llm
          path: docs
          default: true
          content:
            directory: ./docs
            language: en
