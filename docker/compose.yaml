# The llm server, with its web UI, at http://localhost:8084/, and, with the
# ollama profile, an Ollama server, and with the whisper profile, a
# go-whisper server, which transcribes speech, whose models it can use:
#
#   docker compose -f docker/compose.yaml up -d
#   docker compose -f docker/compose.yaml --profile ollama --profile whisper up -d
#
# The variables are read from the environment, or a .env file beside this
# one. A new installation has the Eliza provider, unless NO_ELIZA is set,
# and a provider for each of these which is set:
#
#   OLLAMA_ADDR, which is http://ollama:11434 for the ollama profile
#   GOWHISPER_ADDR, which is http://whisper:8081 for the whisper profile
#   OPENAI_API_KEY and the other keys, which are read when they're used,
#   rather than stored
#
# The connectors whose OAuth apps' credentials are set, such as
# GITHUB_CLIENT_ID, are offered under Add connector. Its providers,
# sessions, agents, memory and connectors are kept in the llm volume, and
# go-whisper's models in the whisper volume.

name: llm

services:
  llm:
    image: ghcr.io/mutablelogic/llm:${LLM_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      # On localhost only, as the server has no authentication yet, unless
      # LLM_BIND is set, such as to 0.0.0.0, for a network you trust
      - "${LLM_BIND:-127.0.0.1}:${LLM_PORT:-8084}:8084"
    volumes:
      - llm:/data
    environment:
      # The user the server runs as
      UID: ${UID:-}
      GID: ${GID:-}
      # LLM providers of a new installation
      NO_ELIZA: ${NO_ELIZA:-}
      OLLAMA_ADDR: ${OLLAMA_ADDR:-}
      GOWHISPER_ADDR: ${GOWHISPER_ADDR:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # The tools, which are added when their credentials are set.
      # OLLAMA_API_KEY is for Ollama's cloud service, whose web search, and
      # fetch, are the tools, rather than for the Ollama provider, which
      # OLLAMA_ADDR adds, and needs no key. DEEPSEEK_API_KEY, above, also
      # adds DeepSeek's web search and fetch.
      WEATHERAPI_API_KEY: ${WEATHERAPI_API_KEY:-}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      HOMEASSISTANT_URL: ${HOMEASSISTANT_URL:-}
      HOMEASSISTANT_API_KEY: ${HOMEASSISTANT_API_KEY:-}
      # Messaging, whose chats are connected to conversations, such as a
      # Telegram bot's, from BotFather
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # The OAuth apps of the connectors whose sign-in doesn't register
      # clients, which are offered under Add connector when they're set.
      # Register the redirect URL the connector panel's Advanced section
      # shows with each app.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ASANA_CLIENT_ID: ${ASANA_CLIENT_ID:-}
      ASANA_CLIENT_SECRET: ${ASANA_CLIENT_SECRET:-}
      HARVEY_CLIENT_ID: ${HARVEY_CLIENT_ID:-}
      HARVEY_CLIENT_SECRET: ${HARVEY_CLIENT_SECRET:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      PAGERDUTY_CLIENT_ID: ${PAGERDUTY_CLIENT_ID:-}
      PAGERDUTY_CLIENT_SECRET: ${PAGERDUTY_CLIENT_SECRET:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      # The server's settings, with their defaults: how many events run at
      # once, how long sessions and unused resources are kept, the largest
      # resource, in bytes, and how long a connector's MCP server, and one of
      # its tools, is waited for, where 0 is the toolkit's default
      LLM_MAX_EVENTS: ${LLM_MAX_EVENTS:-2}
      LLM_SESSION_RETENTION: ${LLM_SESSION_RETENTION:-14d}
      LLM_RESOURCE_RETENTION: ${LLM_RESOURCE_RETENTION:-24h}
      LLM_RESOURCE_MAX_SIZE: ${LLM_RESOURCE_MAX_SIZE:-268435456}
      LLM_MCP_CONNECT_TIMEOUT: ${LLM_MCP_CONNECT_TIMEOUT:-30s}
      LLM_MCP_TOOL_TIMEOUT: ${LLM_MCP_TOOL_TIMEOUT:-0}
    depends_on:
      # Ollama and go-whisper, when they're run, are started, and answer,
      # first, so a new installation can add them
      ollama:
        condition: service_healthy
        required: false
      whisper:
        condition: service_healthy
        required: false

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  whisper:
    image: ghcr.io/mutablelogic/go-whisper:${GOWHISPER_VERSION:-latest}
    profiles: [whisper]
    command: ["run"]
    restart: unless-stopped
    volumes:
      - whisper:/data
    healthcheck:
      test: ["CMD", "gowhisper", "models"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  llm:
  ollama:
  whisper:
