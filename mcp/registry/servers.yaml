# The remote MCP servers which are offered, as templates, under "Add
# connector", in addition to a custom one, by their name, and URL, and the
# names of the credentials of the client each is signed in to with, when its
# sign-in doesn't register clients itself. One whose credentials the server
# doesn't have, such as its environment variables, isn't offered.
- name: GitHub
  description: Repositories, issues, pull requests and code search, with GitHub's own MCP server
  url: https://api.githubcopilot.com/mcp/
  client_id_credential: GITHUB_CLIENT_ID
  client_secret_credential: GITHUB_CLIENT_SECRET

# Atlassian's sign-in registers clients itself, so it needs no credentials,
# and is always offered
- name: Atlassian
  description: Jira issues and Confluence pages, with Atlassian's own MCP server
  url: https://mcp.atlassian.com/v1/mcp/authv2

# Airtable's sign-in registers clients itself, so it needs no credentials,
# and is always offered
- name: Airtable
  description: Bases, tables, records and comments, with Airtable's own MCP server
  url: https://mcp.airtable.com/mcp

- name: Asana
  description: Tasks, projects, portfolios and goals, with Asana's own MCP server
  url: https://mcp.asana.com/v2/mcp
  client_id_credential: ASANA_CLIENT_ID
  client_secret_credential: ASANA_CLIENT_SECRET

# Canva's sign-in registers clients itself, so it needs no credentials, and
# is always offered
- name: Canva
  description: Designs, templates and brand assets, with Canva's own MCP server
  url: https://mcp.canva.com/mcp

# Cloudflare's sign-in registers clients itself, so it needs no credentials,
# and is always offered
- name: Cloudflare
  description: Workers, KV, R2 and D1 in your Cloudflare account, with Cloudflare's Workers Bindings MCP server
  url: https://bindings.mcp.cloudflare.com/mcp

# Lingviko's der die das needs no sign-in, so it needs no credentials, and
# is always offered
- name: der die das (Lingviko)
  description: The genders of German nouns, from Wiktionary, and checking German text for wrong articles
  url: https://derdiedas.lingviko.com/mcp

# Notion's sign-in registers clients itself, so it needs no credentials, and
# is always offered
- name: Notion
  description: Pages, databases and comments in your Notion workspace, with Notion's own MCP server
  url: https://mcp.notion.com/mcp
