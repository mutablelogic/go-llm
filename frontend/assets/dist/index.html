<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>llm</title>
    <link rel="icon" href="icon/llm.svg" type="image/svg+xml">
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
    <style>
        body {
            margin: 0;
            background: var(--cds-background);
            color: var(--cds-text-primary);
        }

        /* The header is 3rem high, and the side nav 16rem wide when it's
           fixed open on large screens */
        main {
            padding: calc(3rem + 2rem) 2rem 2rem;
        }

        /* A notification's link, such as to the chat a heartbeat is for, which
           is on the toast's dark background */
        .notification-link {
            display: block;
            margin-bottom: 1rem;
            color: var(--cds-link-inverse, #78a9ff);
        }

        /* The server's status is at the bottom of the side navigation, and
           its items scroll above it, rather than beneath it */
        cds-side-nav-items {
            margin-bottom: calc(3rem + 1px);
        }

        gs-server-status {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            border-top: 1px solid var(--cds-border-subtle);
        }

        /* And above the player, while something is played */
        cds-side-nav:has(llm-media-player[playing]) cds-side-nav-items {
            margin-bottom: calc(8rem + 2px);
        }

        /* The pages which fill the screen below the header, which are all
           but the page which isn't found, have no padding from main, with
           their headings in a dark bar, like the header's, and their
           content beneath, which scrolls, so its bottom is the bottom of the
           screen */
        main:has(> .full:not([hidden])) {
            padding: 3rem 0 0;
        }

        .full:not([hidden]) {
            display: flex;
            flex-direction: column;
            height: calc(100dvh - 3rem);
        }

        .full::part(heading) {
            --llm-heading-secondary: #c6c6c6;
            margin: 0;
            padding: 1rem 2rem;
            background: #262626;
            color: #f4f4f4;
        }

        /* The models and tools pages have their tables beneath their
           headings, with a margin around them, which scroll */
        .full > .content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 2rem;
        }

        /* The chat page has the list of chats beside the conversation */
        .full > .chat {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 18rem minmax(0, 1fr);
        }

        @media (max-width: 42rem) {
            .full > .chat {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: 12rem minmax(0, 1fr);
            }
        }

        /* A workspace's resources fill the page, beneath its header, and
           scroll */
        .full > .workspace-files {
            flex: 1;
            min-height: 0;
        }

        /* A workspace which is a tree has its folders on the left, which
           scroll, and the files of the folder which is shown on the right,
           which fill the rest of the page */
        .full > .workspace-split {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 18rem minmax(0, 1fr);
        }

        .workspace-tree {
            overflow: auto;
            background: var(--cds-layer-01, #f4f4f4);
            border-right: 1px solid var(--cds-border-subtle);
        }

        .workspace-files {
            overflow-y: auto;
        }

        @media (max-width: 42rem) {
            .full > .workspace-split {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: 12rem minmax(0, 1fr);
            }

            .workspace-tree {
                border-right: none;
                border-bottom: 1px solid var(--cds-border-subtle);
            }
        }

        /* A file, in its panel: a preview, what it is, its metadata, and
           its artwork */
        .workspace-file .preview {
            display: block;
            max-width: 100%;
            margin-bottom: 1rem;
        }

        .workspace-file h3 {
            margin: 1.5rem 0 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .workspace-file dl {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: 0.5rem 1rem;
            margin: 0;
            font-size: 0.875rem;
        }

        .workspace-file dt {
            color: var(--cds-text-secondary, #525252);
        }

        .workspace-file dd {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .workspace-file .preview-loading {
            margin-top: 1.5rem;
        }

        .workspace-file .preview-markdown {
            display: block;
            padding: 1rem;
            background: var(--cds-layer-02, #fff);
        }

        .workspace-file .preview-more {
            margin: 0.5rem 0 0;
            color: var(--cds-text-secondary, #525252);
            font-size: 0.75rem;
        }

        .workspace-file .artwork {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .workspace-file figure {
            margin: 0;
            max-width: 10rem;
        }

        .workspace-file figure img {
            display: block;
            max-width: 100%;
        }

        .workspace-file figcaption {
            margin-top: 0.25rem;
            color: var(--cds-text-secondary, #525252);
            font-size: 0.75rem;
        }

        .workspace-tags {
            display: inline-flex;
            gap: 0.25rem;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        @media (min-width: 66rem) {
            main {
                margin-left: 16rem;
            }
        }
    </style>
</head>

<body class="cds--white">
    <!-- The header, and the sidebar of the modules' pages, with the player,
         while something is played, and the server's status, at its bottom -->
    <div class="cds--g100">
        <gs-header></gs-header>
        <gs-side-nav>
            <llm-media-player></llm-media-player>
            <gs-server-status></gs-server-status>
        </gs-side-nav>
    </div>

    <!-- The modules' pages, which they add, of which the router shows the
         one the location selects -->
    <main id="main-content"></main>

    <gs-notifications></gs-notifications>
</body>

</html>
